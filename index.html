<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café La Esquina</title>

  <link rel="stylesheet" href="estilos.css">
</head>

<body>

  <header class="header">
    <div class="contenedor header-in">
      <span class="logo">Café La Esquina</span>

      <nav>
        <a href="#menu">Menú</a>
        <a href="#pedido">Mi pedido</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="contenedor">
      <h1>Café recién colado y dulces de la casa</h1>
      <p>Desayunos y meriendas en Punta Cana, todos los días de 7am a 7pm.</p>
      <a href="#menu" class="btn">Ver el menú</a>
    </div>
  </section>

  <main class="contenedor layout" id="menu">

    <section class="col-menu">
      <h2>Nuestro menú</h2>

      <div class="filtros">
        <button class="filtro activo" data-cat="todo">Todo</button>
        <button class="filtro" data-cat="cafe">Cafe</button>
        <button class="filtro" data-cat="dulce">Dulces</button>
        <button class="filtro" data-cat="salado">Salados</button>
      </div>

      <div class="grid" id="lista"></div>
    </section>

    <aside class="col-pedido" id="pedido">
      <div class="caja-pedido">
        <h3>Mi pedido</h3>

        <ul id="items-pedido">
          <li class="vacio">Todavía no has agregado nada</li>
        </ul>

        <p class="total">
          Total: <span id="total">RD$0</span>
        </p>

        <button class="btn btn-full" id="btn-vaciar">
          Vaciar pedido
        </button>
      </div>
    </aside>

  </main>

  <footer class="footer">
    <div class="contenedor">
      <p>Café La Esquina</p>
    </div>
  </footer>

  <script src="script.js"></script>

</body>
</html>
